name: release-check

# A v* tag must sit on main, be green, match COBALT_VERSION and have a
# CHANGELOG section. Wolfram hosts the shared check; Cobalt only reads its
# version header. Refs ewanc26/wolfram#232.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  checks: read

jobs:
  version:
    name: read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read COBALT_VERSION
        run: |
          version=$(sed -n 's/.*COBALT_VERSION "\([^"]*\)".*/\1/p' src/util/version.h)
          [ -n "$version" ] || { echo "::error::no COBALT_VERSION in src/util/version.h"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: verify the release
    needs: version
    uses: ewanc26/wolfram/.github/workflows/release-check-reusable.yml@v0.44.1
    with:
      tag: ${{ github.ref_name }}
      version: ${{ needs.version.outputs.version }}
      canon_ref: v0.44.1
      required_checks: CI gate
      wait_seconds: 900
