name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  drift:
    # The written flow, its enforcement and the hosting repo must agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: main
          path: wolfram
      - name: Flow checks fail on deliberate violations
        run: .github/flow/flow-selftest.sh
      - name: Drift
        # Compared with Wolfram's copy once Wolfram hosts the flow; until
        # then Cobalt is the canonical host and there is nothing to compare.
        run: |
          if [ -f wolfram/.github/flow/flow-check.sh ]; then
            .github/flow/check-drift.sh wolfram
          else
            .github/flow/check-drift.sh
          fi

  direct-push-guard:
    # Branch protection is the owner's to set. Until it is, this turns a push
    # to main that did not come from a pull request into a red main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'length')
          [ "$n" -gt 0 ] || { echo "::error::$GITHUB_SHA reached main without a pull request"; exit 1; }

  host-tests:
    runs-on: ubuntu-latest
    env:
      E2E_BUILD: ${{ github.workspace }}/wolfram/build-host
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          path: cobalt
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: main
          path: wolfram
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcurl4-openssl-dev \
            libcjson-dev libmbedtls-dev libmicrohttpd-dev libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
            fonts-dejavu-core
      - name: Build Wolfram for the host
        working-directory: wolfram
        run: |
          cmake -S . -B build-host -DWOLFRAM_BUILD_TESTS=OFF -DWOLFRAM_BUILD_EXAMPLES=OFF \
            -DWOLFRAM_BUILD_TEST_HTTPD=ON
          cmake --build build-host -j4 --target wolfram
      - name: Unit tests and warnings sweep
        working-directory: cobalt
        run: make test
      - name: End-to-end
        working-directory: cobalt
        run: make -C tests e2e
      - name: Snapshots
        working-directory: cobalt
        run: make -C tests snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: cobalt/tests/build/snapshot
          if-no-files-found: ignore

  wuhb:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cobalt
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: main
          path: wolfram
      - name: Install extra dependencies
        run: |
          # pkg.devkitpro.org intermittently answers 403 to CI runners, which
          # fails the database *refresh*. The refresh is not what the build
          # needs though: pacman installs from the database files already in
          # the image, so try those before giving up. This has bitten three of
          # four runs on 2026-10-05 alone, and burning the retry loop only
          # turned a two-second refresh failure into a two-minute one.
          extra_pkgs="wiiu-sdl2 wiiu-sdl2_ttf wiiu-sdl2_image wiiu-curl wiiu-mbedtls"
          install_extra() {
            dkp-pacman -S --noconfirm --needed $extra_pkgs
          }

          for attempt in 1 2 3 4; do
            dkp-pacman -Syu --noconfirm && install_extra && break
            [ "$attempt" = 4 ] && break
            sleep $((attempt * 15))
          done

          # No refresh: whatever databases the image ships with.
          install_extra || true

          # And now prove it, rather than trusting an exit status. This is the
          # same reasoning as the "Verify Wolfram is linked" step below: a
          # dependency missing quietly is how v0.4.0 shipped with the whole
          # protocol layer compiled out, so the job states plainly which
          # packages are absent instead of surfacing a pacman URL error.
          missing=""
          for p in $extra_pkgs; do
            dkp-pacman -Q "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::devkitPro packages missing from the runner:$missing"
            exit 1
          fi

          apt-get update && apt-get install -y --no-install-recommends cmake openssl curl git make
      - name: Build Wolfram for Wii U
        working-directory: wolfram
        run: |
          cmake -S . -B build-wiiu \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/.devdeps/wiiu.cmake \
            -DWOLFRAM_BUILD_WIIU=ON \
            -DWOLFRAM_BUILD_TESTS=OFF \
            -DWOLFRAM_BUILD_EXAMPLES=OFF
          cmake --build build-wiiu -j4 --target wolfram
      - name: Bundle
        working-directory: cobalt
        run: make bundle
      - name: Verify Wolfram is linked
        # bundle refuses to build without Wolfram, but the release path once
        # shipped a Wolfram-free wuhb (v0.4.0) because the missing library
        # silently compiled the protocol layer out. The WUHB compresses the
        # RPX internally, so check the linker map instead of the artifact.
        run: grep -q "libwolfram.a" cobalt/build/cobalt.map
      - uses: actions/upload-artifact@v4
        with:
          name: cobalt-wuhb
          path: cobalt/dist/wiiu/apps/cobalt.wuhb
